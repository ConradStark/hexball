# Builds the game and publishes dist/pwa to GitHub Pages on every push to main.
# One-time setup on GitHub: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node build.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pwa
      - id: deploy
        uses: actions/deploy-pages@v5
